# M11+ example: a pveconform DiskImage — a downloadable disk-image storage
# artifact (PVE 9 `import` content pool: qcow2 / vmdk / raw).
#
# This is the third artifact kind (alongside ISO and CTTemplate) and is what
# lets a kind: VM boot a real OS WITHOUT a template: a VM disk references it
# via `spec.disks[].image`, and pveconform seeds the disk at create with PVE's
# `import-from` form (`<pool>:0,import-from=<storage>:import/<filename>`).
#
# - No PVE numeric id: identity is `metadata.name` on the pveconform side,
#   and (node, storage, filename) on the PVE side.
# - Multi-node placement via spec.nodes: the file must exist on each declared
#   node/storage pair.
# - Never deleted by pveconform (artifact rule).
# - PVE 9.2's import pool accepts .qcow2 | .vmdk | .raw (probed on
#   conformance-dev); other extensions are rejected at download time.
# - The PVE node must have outbound HTTPS to fetch from spec.url.
apiVersion: proxops/v1alpha1
kind: DiskImage
metadata:
  name: debian-13-cloud
spec:
  nodes:
    - pve01
  storage: local          # PVE storage id with an `import` pool (dir storage)
  filename: debian-13-genericcloud-amd64.qcow2
  url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
  # optional pin on a known-good digest (review aid; PVE 9.2's download API
  # does not accept a verify parameter — see docs/OPERATIONS.md).
  # checksum:
  #   algorithm: sha256
  #   value: <sha256-hex>
