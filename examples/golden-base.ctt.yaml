# Golden CTTemplate: a downloadable PVE "vztmpl" container template that
# pveconform keeps present on every node it declares. New LXCs are
# bootstrapped from this file by PVE itself (via `ostemplate` at create
# time); pveconform owns only the storage artifact, not the LXC.
#
# - No PVE numeric id: CTTemplate is a storage artifact, not a cloneable
#   PVE LXC. The legacy "clone a CT then mark-as-template" model was
#   removed in the M6 rework.
# - Multi-node placement via spec.nodes: the file must exist on each
#   declared node/storage pair; the planner downloads per missing node.
# - Never pruned: removing this manifest does not delete the file on
#   PVE storage (conservative artifact-deletion guarantee).
apiVersion: proxops/v1alpha1
kind: CTTemplate
metadata:
  name: golden-base
  labels:
    role: image
spec:
  nodes:
    - pve01
  storage: local
  filename: debian-13-standard_13.6.1-1_amd64.tar.zst
  url: https://ftp-master.debian.org/debian/dists/trixie/main/installer-amd64/current/images/container-images/amd64/debian-13-standard_13.6.1-1_amd64.tar.zst
  # optional pin on a known-good checksum (review aid; PVE 9.2's download
  # API does not accept a verify parameter — see docs/OPERATIONS.md).
  # checksum:
  #   algorithm: sha256
  #   value: <sha256-hex>
