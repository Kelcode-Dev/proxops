# Golden CTT: clone PVE CT 200 (an existing base container on pve01) into
# the pinned id 1000, then mark it as a template.
#
# In PVE's listing this object will appear with type "lxc" and
# "template"=1. New containers are bootstrapped from it by PVE/automation
# out-of-band; pveconform only guarantees the template exists and is
# flagged.
#
# Prerequisite before first `pveconform apply`:
#   - CT 200 exists on pve01 (created manually or by other tooling).
#   - CT 200 is stopped (PVE refuses to clone a running CT).
apiVersion: proxops/v1alpha1
kind: CTTemplate
metadata:
  name: golden-base
  labels:
    role: image
spec:
  node: pve01
  vmid: 1000       # pinned destination cid
  source: 200      # clone source cid (existing PVE CT)
  pve-description: pveconform-managed golden base image
  # full: false    # CoW clone (PVE default); set true for a full copy
