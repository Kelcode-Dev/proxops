# SYNTHETIC + TEST-ONLY SOPS fixture for the example cluster.
#
# This is the canonical shape of a cluster's secrets-file:
#   - secrets:      flat credentials ProxOps reads for PVE auth (+ git in URL
#                   mode). The reference block in config.yaml names these.
#   - cloud-init:    structured cloud-init material (M13.2) — ssh-keys
#                   (name -> one OpenSSH public-key line) and passwords
#                   (name -> plaintext cipassword). The manifests in this tree
#                   reference these via spec.cloud-init-data.ssh-key-refs (plural)
#                   and .ci-password-ref (singular).
#
# The values below are ENCRYPTED to a THROWAWAY age identity that was deleted
# after generation: no one can decrypt this fixture, and it does NOT require
# you to supply a private key. It exists to demonstrate the file structure.
#
# To use this tree against a real PVE cluster: regenerate the SOPS file with
# YOUR age key so the values actually match your cluster, e.g.
#
#   age-keygen -o ~/.local/share/proxops/example.age
#   sops -e \
#     --age <recipient> \
#     <your-plaintext.yaml> > clusters/example/secrets.sops.yaml
#
# NEVER commit a real private age key, a real PVE token, or a real password.
# The committed file should carry encrypted values + the public age recipient
# only. See docs/sops-credentials.md.
