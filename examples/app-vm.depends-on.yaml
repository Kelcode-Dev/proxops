# Demonstrates dependency inference.
#
# Two independent mechanisms build this VM's prerequisites:
#
#  1. STRUCTURED (inferred): spec.hardware.cdrom.iso names an ISO manifest
#     ("talos-1-8-0"). pveconform derives an ISO -> VM edge from it, so the
#     installer ISO is downloaded before the VM is created. No annotation
#     required.
#  2. ANNOTATION (escape hatch): the proxops/depends-on edge declares
#     this VM also wants the "golden-base" CTTemplate ready. Use this for
#     relationships that are not expressible in a structured field.
#
# Both edge sets are merged by the parser; unknown targets and cycles fail
# the whole cycle (fail-closed). The planner creates prerequisites first,
# in deterministic topological order.
apiVersion: proxops/v1alpha1
kind: VM
metadata:
  name: app-vm
  annotations:
    proxops/depends-on: "CTTemplate:golden-base"
spec:
  node: pve01
  vmid: 400
  memory: 2GiB
  cpu:
    type: host
    cores: 2
  disks:
    - storage: vm_disks
      size: 20GiB
      interface: scsi0
      controller: virtio-scsi-single
  hardware:
    cdrom:
      iso: talos-1-8-0    # -> inferred dependency on ISO "talos-1-8-0"
  networks:
    - model: virtio
      bridge: vmbr0
