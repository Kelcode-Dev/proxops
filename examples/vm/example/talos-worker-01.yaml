# A single VM, pinned to pve01/vmid 142, 8GiB, 4 host-vCPUs, one scsi disk on
# the "vm_disks" pool (50GiB, virtio-scsi-single + I/O thread), one virtio NIC
# on vmbr2.
#
# Boot: PVE start=0 during create (the agent starts it in a separate plan
# step).
apiVersion: proxops/v1alpha1
kind: VM
metadata:
  name: talos-worker-01
  labels:
    role: worker
    cluster: prod
spec:
  node: pve01
  vmid: 142            # pinned (agent won't invent an id)
  state: started       # default; also "stopped"
  memory: 8GiB         # PVE wire: 8388608K
  cpu:
    type: host
    cores: 4
  disks:
    - storage: vm_disks
      size: 50GiB
      interface: scsi0          # PVE slot
      controller: virtio-scsi-single
      iothread: true
      # M13 drive options (PVE inline tokens on the drive string):
      # discard: on             # TRIM passthrough ("ignore" | "on")
      # ssd: true               # advertise SSD — scsi/sata/ide ONLY (PVE
      #                         # rejects ssd= on virtio/nvme buses)
      # aio: io_uring           # "native" | "threads" | "io_uring"
  networks:
    - model: virtio
      bridge: vmbr2
  hardware:
    # machine: q35     # i440fx (PVE default) | q35
    # bios: ovmf       # seabios (PVE default) | ovmf
    # display: std     # PVE `vga` (default)
    # cdrom — three states:
    #   (block absent)          proxops does NOT own the PVE IDE slot; PVE
    #                           keeps its default
    #   cdrom:                  proxops owns the slot and attaches the
    #     iso: base-iso         referenced ISO. Creates a structured VM->ISO
    #                           dependency (planner orders the download).
    #   cdrom:                  proxops owns the slot and DETACHES it
    #     iso: none             (emits `ide<N>=none`). Use to model "no CD
    #                           ever", or to remove an ISO ref previously.
    # efi-disk:                 # valid only when bios=ovmf
    #   storage: local-lvm
    #   size: 8MiB
    # cloud-init:
    #   enabled: true
    #   storage: local          # claims ide2 → cdrom slot shifts to ide3
    # tpm:
    #   version: v2.0
    # serial0: socket
  options:
    onboot: true                # auto-start when the node boots
    startup: "order=10"         # PVE `startup` ordering / shutdown hint
    protection: false           # blocks accidental destroy (off here)
    agent: true                 # virtio qemu-guest-agent
    tablet: false
    # boot-order: [scsi0, net0] # PVE `boot=order=...` (unset -> PVE default)
  pve-description: "talos worker"
  # extra:                       # escape hatch, sent verbatim to PVE
  #   watchdog: i6300esb
