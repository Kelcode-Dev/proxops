# ProxOps — PROCESS-WIDE configuration template (repository-first model).
#
# The canonical workflow does NOT need this file at all: a ProxOps GitOps
# repository IS the unit of operation. `cd` into the repository and run
# `proxops diff` — ProxOps discovers the repository from the current
# directory, uses this file when present (as <repo>/proxops.yaml) for
# process-wide settings, and reads each clusters/<name>/config.yaml for
# per-cluster endpoint / allowlist / credentials.
#
# This template shows every process-wide field (optional; defaults are
# sensible). Put ONLY process-level concerns here (log, reconcile knobs,
# listen, data-dir, bootstrap credentials, git URL-mode overrides).
# Per-cluster concerns belong in clusters/<name>/config.yaml — never here.
#
# Precedence (lowest → highest): built-in defaults → this file → CLI flags
# → environment (credentials ONLY; never read from this file or flags).

log:
  level: info              # debug | info | warn | error

pve:
  # Bootstrap credentials, used ONLY by clusters that do not carry a SOPS
  # secrets-file reference (clusters whose credentials come from env).
  auth: token              # token (PVE API token, recommended) | ticket
  user: ""                 # PVE user id (token owner, or ticket user)
  token-id: ""             # token name for auth=token (user@realm!token-id=<uuid>)
  # token: ""              # token uuid — use env PROXOPS_PVE_TOKEN
  # token-value: ""        # fully-composed "user@realm!tokenid=uuid" —
                           # use env PROXOPS_PVE_TOKEN_VALUE (overrides the pair)
  # password: ""           # ticket auth only — use env PROXOPS_PVE_PASSWORD
  # ca-file: ""            # PVE cluster CA (shared by every cluster); empty = system trust store
  clusters: {}             # clusters are declared CLUSTER-LOCALLY in
                           # clusters/<name>/config.yaml, not here.

git:
  # Local (repository-first) mode is the default: the work tree ProxOps was
  # launched from is the source of truth (no fetch, no token). No git block
  # is required for that.
  #
  # URL mode (optional override): reconcile a REMOTE git repository instead
  # of the local work tree:
  # url: https://git.example.com/you/proxops-gitops.git
  branch: main
  # token: ""              # use env PROXOPS_GIT_TOKEN

reconcile:
  poll-interval: 30s       # watch-mode cycle cadence
  task-timeout: 30m        # max wait per PVE async task (clone/download/create)
  prune-budget: 3          # max deletions per cycle, PER CLUSTER

listen: 127.0.0.1:9494     # /healthz /metrics /status bind address
                           # use 0.0.0.0:9494 for a monitoring scrape
data-dir: ~/.local/share/proxops   # git cache + scratch (not user data)
