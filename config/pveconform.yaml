# pveconform — reference configuration (M8 multi-cluster model).
#
# Precedence (lowest → highest): built-in defaults → this file → CLI flags →
# environment (credentials ONLY, never read from this file or flags).
# Every field is optional; defaults are shown as comments.
#
# Load with:  pveconform run --config config/pveconform.yaml
#
# M8: pve.clusters is a map of NAMED PVE clusters. Each cluster has its own
# base-url (endpoint) and node allowlist. pveconform's reconcile cycle is
# cluster-scoped: one pveconform git composition
# (clusters/<name>/resources.yaml) → one named cluster → one PVE endpoint →
# one node allowlist → that cluster's resources. There is no implicit
# "current cluster".

log:
  level: info              # debug | info | warn | error

pve:
  auth: token              # token (PVE API token, recommended) | ticket (user+password)
  user: root@pam           # PVE user id (token owner, or ticket user)
  token-id: pveconform     # token name for auth=token (user@pam!token-id=<uuid>)
  # token: ""              # token uuid — use env PVECONFORM_PVE_TOKEN
  # token-value: ""        # fully-composed "user@realm!tokenid=uuid" —
                           # use env PVECONFORM_PVE_TOKEN_VALUE (overrides the pair)
  # password: ""           # ticket auth only — use env PVECONFORM_PVE_PASSWORD
  # ca-file: ""            # PVE cluster CA (shared by every cluster); empty = system trust store

  # Named PVE clusters. At least one is required.
  # The cluster name MUST match a GitOps composition directory
  # (clusters/<name>/resources.yaml) — the name is the shared identity.
  # A composition with no entry here (or vice-versa) fails closed.
  clusters:
    conformance-dev:
      # base-url is the single PVE API endpoint for this cluster: PVE exposes
      # the whole API on every node, so one FQDN reaches every object on every
      # node of that cluster; the node name lives only in the request path.
      # Must be a resolvable hostname, not a bare PVE node name.
      base-url: https://pve-dev-01.example:8006
      # Node allowlist (cluster boundary). A manifest spec.node outside this
      # list aborts the cluster's cycle before any PVE call; every PVE read,
      # write, and prune candidate is scoped to these nodes.
      nodes:
        - pve-dev-01
        - pve-dev-02
    # Add more clusters (e.g. prod-a) here when needed. Each cluster
    # must have its own base-url (endpoints are never shared between named
    # clusters — that would merge two live inventories into one prune scope).

git:
  # URL mode (default):
  url: https://github.com/example/pveconform-manifests.git
  branch: main
  # token: ""              # use env PVECONFORM_GIT_TOKEN
  # Local (air-gapped) mode — mutually exclusive with url:
  # path: /var/lib/pveconform/manifests

reconcile:
  poll-interval: 30s       # watch-mode cycle cadence
  task-timeout: 30m        # max wait per PVE async task (clone/download/create)
  prune-budget: 3          # max deletions per cycle, PER CLUSTER

listen: 127.0.0.1:9494     # /healthz /metrics /status bind address
                           # use 0.0.0.0:9494 for a monitoring scrape
data-dir: ~/.local/share/pveconform   # git cache + scratch (not user data)
