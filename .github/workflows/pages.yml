# Build and publish the ProxOps documentation site to GitHub Pages.
#
# The site is generated from the source-controlled Markdown in docs/ via
# MkDocs (mkdocs.yml) — a thin view over the docs, never a second source
# of truth. No secrets are required: only the standard GitHub Pages
# workflow permissions (pages: write, contents: read).
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  pull_request:
  # Allow manual redeploys from the Actions tab.
  workflow_dispatch:

# One concurrent Pages build at a time.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the docs site
        run: |
          pip install --quiet mkdocs
          mkdocs build --strict --site-dir site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    # Only deploy from the branch that owns the Pages configuration
    # (default main; adjust if the default branch differs).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
